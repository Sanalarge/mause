name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  approval:
    name: Maintainer approval gate
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.review.outputs.ready || steps.direct.outputs.ready }}
    steps:
      - id: direct
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
        run: echo "ready=true" >> "$GITHUB_OUTPUT"
      - id: review
        if: startsWith(github.event_name, 'pull_request')
        uses: actions/github-script@v9
        with:
          script: |
            const maintainers = new Map([
              ["sanalarge", "Sanalarge"],
              ["bytaymur", "ByTaymur"],
              ["serdarkayiskiran", "serdarkayiskiran"],
            ])
            const pull = context.payload.pull_request
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pull.number,
              per_page: 100,
            })
            const approved = new Set()
            for (const review of reviews) {
              const login = review.user?.login?.toLowerCase()
              if (!maintainers.has(login) || review.commit_id !== pull.head.sha) continue
              if (review.state === "APPROVED") approved.add(login)
              if (review.state === "CHANGES_REQUESTED" || review.state === "DISMISSED") approved.delete(login)
            }
            const author = pull.user.login.toLowerCase()
            if (maintainers.has(author)) approved.add(author)
            const missing = [...maintainers.keys()].filter(login => !approved.has(login))
            const ready = missing.length === 0
            core.setOutput("ready", ready ? "true" : "false")
            await core.summary
              .addHeading("Maintainer approval gate")
              .addRaw(ready ? "All three maintainers approved the current revision." : `Waiting for: ${missing.map(login => maintainers.get(login)).join(", ")}`)
              .write()
            if (!ready) core.setFailed(`Waiting for: ${missing.map(login => maintainers.get(login)).join(", ")}`)

  format:
    needs: approval
    if: needs.approval.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ startsWith(github.event_name, 'pull_request') && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    needs: approval
    if: needs.approval.outputs.ready == 'true'
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ startsWith(github.event_name, 'pull_request') && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config clang libclang-dev libpipewire-0.3-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Validate Linux USB helper and policy
        if: runner.os == 'Linux'
        run: python3 packaging/linux/usb/test_helper.py
      - run: cargo check --locked --all-targets
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D clippy::correctness

  windows-installer:
    needs: approval
    if: needs.approval.outputs.ready == 'true'
    name: Windows setup (build, install, upgrade, uninstall)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ startsWith(github.event_name, 'pull_request') && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-installer
      - name: Build offline setup with verified prerequisites
        shell: pwsh
        run: ./packaging/windows/Build-Installer.ps1
      - name: Install, upgrade, load and uninstall
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem target/windows-installer/output/*-setup.exe)
          if ($setup.Count -ne 1) { throw 'Expected exactly one setup.' }
          ./packaging/windows/Test-Installer.ps1 -Setup $setup.FullName
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-setup-ci
          path: |
            target/windows-installer/output/*
            ${{ runner.temp }}/mause-installer-smoke-*/*.log
          if-no-files-found: error

  android:
    needs: approval
    if: needs.approval.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ startsWith(github.event_name, 'pull_request') && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/android/rust
          key: android-ci
      - name: Android yerel kitaplıklarını derle
        working-directory: mobile/android/rust
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          cargo install cargo-ndk --version 4.1.2 --locked
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 -o ../app/src/main/jniLibs build --release --locked
      - name: Android uygulamasını doğrula
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

  complete:
    name: CI success
    needs: [approval, format, test, windows-installer, android]
    if: always() && needs.approval.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.format.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.windows-installer.result }}" = "success"
          test "${{ needs.android.result }}" = "success"
