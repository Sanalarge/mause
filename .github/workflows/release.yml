
name: Release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MAUSE_UPDATE_REPO: ${{ github.repository }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        run: |
          base=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          series=${base%.*}
          patch=${base##*.}
          last=$(git tag -l "v$series.*" | sed "s/^v$series\.//" | grep -E '^[0-9]+$' | sort -n | tail -1)
          if [ -n "$last" ] && [ "$last" -ge "$patch" ]; then patch=$((last + 1)); fi
          echo "version=$series.$patch" >> "$GITHUB_OUTPUT"
          echo "Sürüm: $series.$patch"

  test:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            name: macos-universal
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.os == 'macos-15-intel' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Sürümü Cargo.toml'a yaz
        shell: bash
        run: |
          perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/m' Cargo.toml
          cargo update --workspace

      - name: macOS derle ve .app paketle
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          app=dist/Mause.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/mause" \
            target/aarch64-apple-darwin/release/mause target/x86_64-apple-darwin/release/mause
          brew install librsvg
          mkdir -p Mause.iconset
          for s in 16 32 128 256 512; do
            rsvg-convert -w $s -h $s assets/logo.svg -o "Mause.iconset/icon_${s}x${s}.png"
            rsvg-convert -w $((s * 2)) -h $((s * 2)) assets/logo.svg -o "Mause.iconset/icon_${s}x${s}@2x.png"
          done
          iconutil -c icns Mause.iconset -o "$app/Contents/Resources/Mause.icns"
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md "$app/Contents/Resources/"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Mause</string>
            <key>CFBundleDisplayName</key><string>Mause</string>
            <key>CFBundleIdentifier</key><string>app.mause.Mause</string>
            <key>CFBundleExecutable</key><string>mause</string>
            <key>CFBundleIconFile</key><string>Mause</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSMicrophoneUsageDescription</key><string>Mikrofonunuzu karşı bilgisayara aktarmak için.</string>
            <key>NSAudioCaptureUsageDescription</key><string>Bu bilgisayarın sesini karşı bilgisayara aktarmak için.</string>
            <key>NSAppleEventsUsageDescription</key><string>Bildirim göstermek için.</string>
          </dict>
          </plist>
          EOF
          zip="mause-v$VERSION-${{ matrix.name }}.zip"
          if [ -z "$APPLE_CERTIFICATE_P12" ]; then
            echo "::warning::Developer ID sertifikası yok: yerel (ad-hoc) imza, kullanıcı ilk açılışta uyarı görür"
            codesign --force --deep --sign - "$app"
            ditto -c -k --keepParent "$app" "$zip"
            exit 0
          fi
          keychain="$RUNNER_TEMP/imza.keychain-db"
          kpass=$(uuidgen)
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/imza.p12"
          security create-keychain -p "$kpass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kpass" "$keychain"
          security import "$RUNNER_TEMP/imza.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$kpass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -m1 "Developer ID Application" | sed -E 's/.*"(.*)"/\1/')
          [ -n "$identity" ] || { echo "::error::Anahtarlıkta Developer ID Application sertifikası yok"; exit 1; }
          echo "İmza: $identity"
          sign() { codesign --force --options runtime --timestamp --entitlements packaging/macos/Mause.entitlements --sign "$identity" "$1"; }
          sign "$app/Contents/MacOS/mause"
          sign "$app"
          codesign --verify --strict --verbose=2 "$app"
          if [ -n "$APPLE_API_KEY_P8" ]; then
            echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            ditto -c -k --keepParent "$app" "$RUNNER_TEMP/onay.zip"
            xcrun notarytool submit "$RUNNER_TEMP/onay.zip" --key "$RUNNER_TEMP/AuthKey.p8" \
              --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait --timeout 30m
            xcrun stapler staple "$app"
            spctl --assess --type execute --verbose "$app"
          else
            echo "::warning::App Store Connect API anahtarı yok: imzalı ama Apple onayından geçmemiş"
          fi
          ditto -c -k --keepParent "$app" "$zip"

      - name: Windows derle ve paketle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'Windows release build failed.' }
          ./packaging/windows/Build-Installer.ps1 -SkipBuild -Version $env:VERSION -OutputDirectory $PWD.Path -LegacyZip

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: mause-v*
          if-no-files-found: error

  build-linux:
    needs: version
    runs-on: ubuntu-latest
    container: debian:12
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NAME: linux-x86_64
    steps:
      - name: Derleme araçları
        run: |
          apt-get update
          apt-get install -y curl git perl build-essential pkg-config clang libclang-dev libpipewire-0.3-dev librsvg2-bin
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-debian12
      - name: Paketleme araçları
        run: |
          command -v cargo-deb >/dev/null || cargo install --locked cargo-deb
          command -v cargo-generate-rpm >/dev/null || cargo install --locked cargo-generate-rpm
      - name: Sürümü Cargo.toml'a yaz
        run: |
          perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/m' Cargo.toml
          cargo update --workspace
      - name: Derle
        run: |
          cargo build --release --locked
          for s in 48 128 256 512; do
            mkdir -p "target/icons/$s"
            rsvg-convert -w "$s" -h "$s" assets/logo.svg -o "target/icons/$s/mause.png"
          done
      - name: .deb, .rpm ve .tar.gz
        run: |
          cargo deb --no-build --output "mause-v$VERSION-$NAME.deb"
          cargo generate-rpm --output "mause-v$VERSION-$NAME.rpm"
          mkdir -p dist/mause
          cp target/release/mause packaging/linux/install.sh packaging/linux/debian/postinst \
             packaging/linux/mause.desktop packaging/linux/60-mause.rules packaging/linux/mause-modules.conf dist/mause/
          cp assets/logo.svg dist/mause/mause.svg
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md dist/mause/
          cp -r packaging/linux/usb dist/mause/usb
          tar -czf "mause-v$VERSION-$NAME.tar.gz" -C dist mause
          ls -l mause-v*
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: mause-v*
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request'
    needs: [version, test, build, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-x86_64
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: macos-universal
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: linux-x86_64
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.V }}
          name: Mause v${{ env.V }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
          body: |
            Mause, aynı ağdaki bilgisayarları ve Android cihazları tek klavye ve fareyle kullanmanızı sağlar.

            ### İndir

            | Platform | Paket | Kurulum |
            | --- | --- | --- |
            | **Windows** · 64 bit | [Setup (.exe)](https://github.com/Sanalarge/mause/releases/download/v${{ env.V }}/mause-v${{ env.V }}-windows-x86_64-setup.exe) | Çalıştırın, yönetici izni ister |
            | **macOS** · Apple Silicon ve Intel | [Uygulama (.zip)](https://github.com/Sanalarge/mause/releases/download/v${{ env.V }}/mause-v${{ env.V }}-macos-universal.zip) | Açın, Mause.app'i Uygulamalar'a taşıyın |
            | **Ubuntu · Debian · Mint** | [.deb](https://github.com/Sanalarge/mause/releases/download/v${{ env.V }}/mause-v${{ env.V }}-linux-x86_64.deb) | `sudo apt install ./mause-v${{ env.V }}-linux-x86_64.deb` |
            | **Fedora · openSUSE · RHEL** | [.rpm](https://github.com/Sanalarge/mause/releases/download/v${{ env.V }}/mause-v${{ env.V }}-linux-x86_64.rpm) | `sudo dnf install ./mause-v${{ env.V }}-linux-x86_64.rpm` |
            | **Diğer Linux** | [.tar.gz](https://github.com/Sanalarge/mause/releases/download/v${{ env.V }}/mause-v${{ env.V }}-linux-x86_64.tar.gz) | Açın, `sudo ./mause/install.sh` çalıştırın |
            | **Android** | Kaynak koddan | [Derleme adımları](https://github.com/Sanalarge/mause#build-from-source) |

            ### Başlarken

            1. Mause'yi iki cihaza da kurup açın. Cihazlar aynı ağda olsun.
            2. Karşı cihazı listeden seçin, iki ekrandaki eşleşme kodunun aynı olduğunu onaylayın.
            3. Fareyi ekranın kenarından karşı cihaza geçirin.

            ### Bilmeniz gerekenler

            - **macOS:** İlk açılışta uyarı çıkarsa *Sistem Ayarları › Gizlilik ve Güvenlik* bölümünden **Yine de Aç**'a tıklayın. Klavye ve fare için Erişilebilirlik izni gerekir.
            - **Windows:** Kurulum, gerekli Visual C++ bileşenlerini ve seçilen USB sürücülerini kurar. Sürücüler yeniden başlatma isteyebilir.
            - **Linux:** glibc 2.35+ (Ubuntu 22.04 ve sonrası) ve PipeWire gerekir. İzni verdikten sonra oturumu bir kez kapatıp açın.
            - Mause erken geliştirme aşamasındadır. Güvendiğiniz bir yerel ağda kullanın.

            <sub>Windows ZIP paketi yalnızca eski sürümlerin güncelleyicisi içindir. Setup dosyasının SHA256 özeti ve bağımlılık listesi aşağıdaki dosyalar arasındadır.</sub>
